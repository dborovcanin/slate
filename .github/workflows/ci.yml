name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run unified perf check
        run: cargo run --release --locked -p slate --bin perf-check

  build-linux-binary:
    name: Build Linux Binary
    needs: test-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Build release binary
        run: cargo build --release --locked -p slate --bin slate

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: slate-linux
          path: target/release/slate
          if-no-files-found: error

  build-macos-binary:
    name: Build macOS Binary
    needs: test-linux
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Build release binary
        run: cargo build --release --locked -p slate --bin slate

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos
          path: target/release/slate
          if-no-files-found: error
