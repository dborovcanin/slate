name: CI

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build-binaries:
    name: Build Binary (${{ matrix.os }})
    needs: test-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Build release binary (Tauri, no bundle)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --no-bundle --ci

      - name: Build macOS DMG bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles dmg --ci

      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH="$(find . -type d \( -path './target/release/bundle/macos/*.app' -o -path './src-tauri/target/release/bundle/macos/*.app' \) -print -quit)"
          DMG_PATH="$(find . -type f \( -path './target/release/bundle/dmg/*.dmg' -o -path './src-tauri/target/release/bundle/dmg/*.dmg' \) -print -quit)"

          if [ -z "$DMG_PATH" ]; then
            echo "::error::Expected macOS DMG was not produced"
            exit 1
          fi

          if [ -n "$APP_PATH" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          MOUNT_DIR="$RUNNER_TEMP/slate-dmg-mount"
          mkdir -p "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR" -quiet >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          DMG_APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$DMG_APP_PATH" ]; then
            echo "::error::DMG does not contain an .app bundle at the root"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$DMG_APP_PATH"
          hdiutil detach "$MOUNT_DIR" -quiet
          trap - EXIT
          echo "Ad-hoc signed test build validated."

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis --ci

      - name: Upload Linux binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: slate-linux
          path: |
            target/release/slate
            src-tauri/target/release/slate
          if-no-files-found: error

      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos
          path: |
            target/release/slate
            src-tauri/target/release/slate
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slate-windows
          path: |
            target/release/slate.exe
            src-tauri/target/release/slate.exe
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slate-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
