name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run unified perf check
        run: npm run perf:check

  build-linux-binary:
    name: Build Linux Binary
    needs: test-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Build release binary (Tauri, no bundle)
        run: npm run tauri build -- --no-bundle --ci

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: slate-linux
          path: |
            target/release/slate
            src-tauri/target/release/slate
          if-no-files-found: error

  build-binaries:
    name: Build Binary (${{ matrix.os }})
    needs: test-linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          shared-key: slate-${{ runner.os }}-rust
          cache-workspace-crates: true
          workspaces: |
            . -> target

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install npm dependencies
        run: npm ci

      - name: Build macOS DMG bundle
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles dmg --ci

      - name: Verify macOS artifacts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP_PATH="$(find . -type d \( -path './target/release/bundle/macos/*.app' -o -path './src-tauri/target/release/bundle/macos/*.app' \) -print -quit)"
          DMG_PATH="$(find . -type f \( -path './target/release/bundle/dmg/*.dmg' -o -path './src-tauri/target/release/bundle/dmg/*.dmg' \) -print -quit)"

          if [ -z "$DMG_PATH" ]; then
            echo "::error::Expected macOS DMG was not produced"
            exit 1
          fi

          if [ -n "$APP_PATH" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          MOUNT_DIR="$RUNNER_TEMP/slate-dmg-mount"
          mkdir -p "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR" -quiet >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          DMG_APP_PATH="$(find "$MOUNT_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$DMG_APP_PATH" ]; then
            echo "::error::DMG does not contain an .app bundle at the root"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$DMG_APP_PATH"
          hdiutil detach "$MOUNT_DIR" -quiet
          trap - EXIT
          echo "Ad-hoc signed test build validated."

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis --ci

      - name: Upload macOS binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos
          path: |
            target/release/slate
            src-tauri/target/release/slate
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: slate-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slate-windows
          path: |
            target/release/slate.exe
            src-tauri/target/release/slate.exe
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: slate-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-aur-bin:
    name: Publish AUR Binary
    needs: build-linux-binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check AUR publish secret
        id: aur-gate
        env:
          GH_AUR_KEY: ${{ secrets.GH_AUR_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GH_AUR_KEY:-}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "AUR publish disabled: GH_AUR_KEY is not configured."
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download Linux artifact
        if: steps.aur-gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: slate-linux
          path: .tmp/slate-linux

      - name: Package binary artifact
        id: package
        if: steps.aur-gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          rev_count="$(git rev-list --count HEAD)"
          rev_short="$(git rev-parse --short HEAD)"
          pkgver="${version}.r${rev_count}.g${rev_short}"
          artifact_path=".tmp/slate-${pkgver}-linux-x86_64.tar.gz"
          binary_path="$(find .tmp/slate-linux -type f -name slate -print -quit)"
          if [ -z "${binary_path}" ]; then
            echo "::error::Could not find Linux slate binary in artifact payload"
            exit 1
          fi
          tmpdir="$(mktemp -d)"
          install -Dm755 "${binary_path}" "${tmpdir}/slate"
          install -Dm644 "slate.png" "${tmpdir}/slate.png"
          tar -C "${tmpdir}" -czf "${artifact_path}" slate slate.png
          sha256="$(sha256sum "${artifact_path}" | awk '{print $1}')"
          echo "pkgver=${pkgver}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${artifact_path}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Publish rolling release asset
        if: steps.aur-gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view aur-bin >/dev/null 2>&1; then
            gh release create aur-bin --title "AUR binary feed" --notes "Rolling assets for AUR slate-bin packaging."
          fi
          gh release upload aur-bin "${{ steps.package.outputs.artifact_path }}" --clobber

      - name: Update AUR PKGBUILD metadata
        if: steps.aur-gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pkgbuild_path = Path("packaging/aur/slate-bin/PKGBUILD")
          text = pkgbuild_path.read_text()
          pkgver = "${{ steps.package.outputs.pkgver }}"
          sha256 = "${{ steps.package.outputs.sha256 }}"

          text = re.sub(r"^pkgver=.*$", f"pkgver={pkgver}", text, flags=re.MULTILINE)
          text = re.sub(
            r'(sha256sums=\(\n\s*")([^"]+)(")',
            rf'\g<1>{sha256}\g<3>',
            text,
            count=1,
          )
          pkgbuild_path.write_text(text)
          PY

      - name: Regenerate .SRCINFO
        if: steps.aur-gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc "cd packaging/aur/slate-bin && makepkg --printsrcinfo > .SRCINFO"

      - name: Push to AUR
        if: steps.aur-gate.outputs.enabled == 'true'
        env:
          GH_AUR_KEY: ${{ secrets.GH_AUR_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${GH_AUR_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes"
          aur_dir="$(mktemp -d)"
          git clone "ssh://aur@aur.archlinux.org/slate-bin.git" "${aur_dir}"

          install -Dm644 packaging/aur/slate-bin/PKGBUILD "${aur_dir}/PKGBUILD"
          install -Dm644 packaging/aur/slate-bin/.SRCINFO "${aur_dir}/.SRCINFO"
          install -Dm644 packaging/aur/slate-bin/slate.desktop "${aur_dir}/slate.desktop"

          cd "${aur_dir}"
          if git diff --quiet; then
            echo "No AUR changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO slate.desktop
          git commit -m "Update slate-bin to ${{ steps.package.outputs.pkgver }}"
          git push origin master
