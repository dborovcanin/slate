[workspace]
resolver = "2"
members = ["crates/tui", "crates/editor-core", "crates/app-core", "crates/table-syntax", "crates/mcp"]

# Thin LTO + single codegen unit pays a small build-time cost for noticeably
# smaller binaries and faster hot loops in editor-core and
# the calc engine. Keep `debug = false` so release artifacts stay slim.
[profile.release]
lto = "thin"
codegen-units = 1
debug = false
