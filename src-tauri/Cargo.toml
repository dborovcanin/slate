[package]
name = "slate"
version = "0.3.0"
edition = "2021"

[lib]
name = "slate_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
app-core = { path = "../crates/app-core" }
editor-core = { path = "../crates/editor-core" }
tauri = { version = "2", features = ["protocol-asset"], optional = true }
ulid = "1"
fend-core = "1"
regex = "1"
tauri-plugin-dialog = { version = "2", optional = true }
libc = "0.2"
arboard = "3.6.1"
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = true }
time = { version = "0.3", features = ["formatting"] }
rustls = { version = "0.23", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
mailparse = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
url = "2"
ttf-parser = "0.25"
rustc-hash = "2"

[features]
default = ["imap", "gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog"]
imap = ["dep:rustls", "dep:rustls-native-certs", "dep:mailparse"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
