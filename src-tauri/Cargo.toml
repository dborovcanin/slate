[package]
name = "slate"
version = "0.1.0"
edition = "2021"

[lib]
name = "slate_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
app-core = { path = "../crates/app-core" }
editor-core = { path = "../crates/editor-core" }
tauri = { version = "2", features = [] }
ulid = "1"
fend-core = "1"
regex = "1"
tauri-plugin-dialog = "2"
libc = "0.2"
arboard = "3.6.1"
base64 = "0.22"
time = { version = "0.3", features = ["formatting"] }
rustls = { version = "0.23", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
mailparse = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }

[features]
default = ["imap"]
imap = ["dep:rustls", "dep:rustls-native-certs", "dep:mailparse"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
