[package]
name = "note"
version = "0.1.0"
edition = "2021"

[lib]
name = "note_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "note"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
directories = "6"
time = { version = "0.3", features = ["formatting"] }
fend-core = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
