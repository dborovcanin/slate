[package]
name = "app-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
ulid = "1"
directories = "6"
regex = "1"
fend-core = "1"
toml = "0.9"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
