[package]
name = "slate-export"
version = "0.3.0"
edition = "2021"

[lib]
name = "slate_export"
path = "src/lib.rs"

[dependencies]
note-session = { path = "../session" }
app-core = { path = "../app-core" }
editor-core = { path = "../editor-core" }
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = true }
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
ttf-parser = "0.25"
ulid = "1"
url = "2"
