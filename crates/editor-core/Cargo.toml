[package]
name = "editor-core"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rustc-hash = "2"

# Only `math_commands` needs the evaluator, and that module is compiled out of
# wasm builds — the UI reaches `:sum` / `:avg` through the host instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fend-core = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
